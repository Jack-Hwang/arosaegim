# 아로새김(Arosaegim) 버전 카탈로그
# 툴체인: Kotlin 2.0.0 / AGP 8.8.2 / Gradle 8.10.2 / JDK 17

[versions]
agp = "8.8.2"
kotlin = "2.0.0"
composeBom = "2024.04.01"
activityCompose = "1.10.1"
lifecycleRuntimeKtx = "2.9.0"
coreKtx = "1.16.0"
junit = "4.13.2"
coroutinesTest = "1.8.1"
serializationJson = "1.7.3"

# Pleos Playground SDK (공개 Maven 저장소에서 제공)
vehicleSdk = "2.3.2"
naviHelperSdk = "3.0.5"
fusedLocationSdk = "1.1.3"
ttsSdk = "3.3.1"

[libraries]
# --- Pleos Playground SDK (ai.pleos.playground) ---
pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "vehicleSdk" }
pleos-navihelper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "naviHelperSdk" }
pleos-fusedlocation = { group = "ai.pleos.playground", name = "FusedLocation", version.ref = "fusedLocationSdk" }
pleos-tts = { group = "ai.pleos.playground", name = "TextToSpeech", version.ref = "ttsSdk" }

# --- Jetpack Compose (BOM 기반) ---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# --- 테스트 ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

# --- 직렬화 (코스/장소 JSON 파싱) ---
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
