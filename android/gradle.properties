# 아로새김(Arosaegim) 빌드 속성

# AndroidX 사용 (Jetpack Compose 필수)
android.useAndroidX=true

# Gradle JVM 힙 및 인코딩 (한국어 리소스 다루므로 UTF-8 명시)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Kotlin 코드 스타일
kotlin.code.style=official

# R 클래스 전이 비활성화(빌드 속도 개선) — 모듈별 리소스만 R에 노출
android.nonTransitiveRClass=true
